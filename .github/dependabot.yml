# Weekly version updates. Minor and patch bumps are grouped into one pull request per ecosystem; majors stay
# separate so each can be reviewed on its own. A cooldown keeps freshly published releases out for a week.
version: 2

updates:
  # pnpm workspace: the root package.json and pnpm-lock.yaml cover every package under packages/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # The runtime is Node 24 LTS: its types follow it, and a new major comes with a deliberate runtime change.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: cargo
    directories:
      - /apps/desktop/src-tauri
      - /crates/drop-iroh
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Updates the SHA pins and their version comments in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Root Dockerfile, docker/relay.Dockerfile and the two proof images: base images pinned by digest (T4.26).
  - package-ecosystem: docker
    directories:
      - /
      - /docker
      - /scripts/hermes-proof
      - /scripts/private-proof
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Only LTS Node lines: a major (often an odd, short-lived release) is a deliberate change, not an update.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps

# OpenSSF Scorecard, from the official example (ossf/scorecard .github/workflows/scorecard-analysis.yml).
# With publish_results the workflow must stay minimal: no top-level env or defaults, no workflow-level write
# permission, and only checkout, scorecard-action, upload-artifact and codeql-action/upload-sarif as steps.
name: scorecard

on:
  push:
    # Only the default branch is supported.
    branches: [main]
  schedule:
    # Weekly, Monday 05:17 UTC.
    - cron: '17 5 * * 1'

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: GitHub OIDC token
      contents: read # checkout and repository checks
      actions: read # workflow checks (Pinned-Dependencies, Token-Permissions…)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif

# Builds the desktop app for macOS, Windows and Linux on GitHub-hosted runners and drafts a GitHub Release (T3.7, T3.8).
# Procedure, artifacts, signing and installation: docs/RELEASE.md.
#
# - push of a `v*` tag: the tag must equal `v` + the version in apps/desktop/src-tauri/tauri.conf.json; the installers,
#   SHA256SUMS.txt and their provenance attestations go to a DRAFT release of that tag. A person publishes it.
# - workflow_dispatch: the same, as a draft prerelease named `v<version>-ci.<run number>`; no tag exists until someone
#   publishes it, so a manual run never creates a tag.
# - pull_request touching the shell, its build or drop-iroh: the five builds and their smoke tests, artifacts only.
#
# No cache anywhere: a release built from a cache that a pull request could fill is a poisoning path (zizmor).
# Signing is optional and needs repository secrets (docs/RELEASE.md, "Signature"): without them the macOS app is signed
# ad hoc and the Windows installers are unsigned.
name: release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
  pull_request:
    paths:
      - apps/desktop/**
      - crates/drop-iroh/**
      - scripts/build-desktop.ts
      - scripts/desktop-updates.ts
      - scripts/merge-desktop-updates.ts
      - scripts/build-mac.ts
      - scripts/desktop-smoke.ts
      - scripts/drop-iroh-notice.ts
      - scripts/bundle.ts
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The version and the release tag, checked before any build.
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tauri.conf.json version '$version' is not x.y.z (MSI accepts numbers only)"
            exit 1
          fi
          if [ "$EVENT" = push ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match tauri.conf.json version v$version"
              exit 1
            fi
            tag="$REF_NAME"
            prerelease=false
          else
            tag="v$version-ci.$RUN_NUMBER"
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.label }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macos-arm64, platform: macos }
          - { os: macos-15-intel, label: macos-x64, platform: macos }
          - { os: windows-latest, label: windows-x64, platform: windows }
          # The oldest Ubuntu with WebKitGTK 4.1, for the widest glibc compatibility (v2.tauri.app/distribute/appimage).
          - { os: ubuntu-22.04, label: linux-x64, platform: linux }
          - { os: ubuntu-22.04-arm, label: linux-arm64, platform: linux }
    env:
      PLATFORM: ${{ matrix.platform }}
      # Signing runs only when every secret it needs exists; the values never reach a log.
      APPLE_SIGNING: >-
        ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' &&
        secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' &&
        secrets.APPLE_API_PRIVATE_KEY != '' }}
      WINDOWS_SIGNING: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      UPDATE_SIGNING: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    defaults:
      run:
        shell: bash
    steps:
      # Prettier and the bundles expect LF endings; the Windows image converts to CRLF on checkout by default.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node embedded in the app is this one: the official build for this system and architecture.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Version read from `packageManager` in package.json.
      - if: matrix.label != 'macos-x64'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # pnpm/action-setup v6.1.0 fails to switch pnpm on Intel Macs (ERR_PNPM_PNPM_ENGINE_IDENTITY_UNVERIFIABLE for
      # @pnpm/exe.darwin-x64): the exact version of `packageManager` from npm instead.
      - name: pnpm from npm (Intel Mac)
        if: matrix.label == 'macos-x64'
        run: npm install --global "pnpm@$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)" # zizmor: ignore[adhoc-packages]
      - name: Linux build dependencies (v2.tauri.app/start/prerequisites)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - run: pnpm install --frozen-lockfile

      - name: Import the Developer ID certificate (v2.tauri.app/distribute/sign/macos)
        if: matrix.platform == 'macos' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import the Windows code signing certificate (v2.tauri.app/distribute/sign/windows)
        if: matrix.platform == 'windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          DROP_RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          update_args=()
          if [ "$UPDATE_SIGNING" = true ]; then update_args=(--updates); fi
          if [ "$PLATFORM" = macos ] && [ "$APPLE_SIGNING" = true ]; then
            node scripts/build-desktop.ts --release --sign "$APPLE_SIGNING_IDENTITY" "${update_args[@]}"
          elif [ "$PLATFORM" = macos ]; then
            node scripts/build-desktop.ts --release --unsigned "${update_args[@]}"
          else
            node scripts/build-desktop.ts --release "${update_args[@]}"
          fi
          ls -l dist/desktop

      # Each installer is opened the way a tester would, then its bundled Node, drop.mjs and drop-iroh run.
      - name: Smoke test the DMG
        if: matrix.platform == 'macos'
        run: |
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/desktop/*.dmg
          codesign --verify --deep --strict --verbose=2 "$mount/drop.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mount/drop.app/Contents/Info.plist"
          node scripts/desktop-smoke.ts "$mount/drop.app/Contents/Resources"
          hdiutil detach "$mount"
      - name: Smoke test the Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/desktop/*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $installed = Join-Path $env:LOCALAPPDATA 'drop'
          Get-ChildItem $installed
          if (-not (Test-Path (Join-Path $installed 'drop-desktop.exe'))) { throw 'drop-desktop.exe is not installed' }
          Get-AuthenticodeSignature (Join-Path $installed 'drop-desktop.exe') | Format-List Status, SignerCertificate
          node scripts/desktop-smoke.ts $installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test the Linux packages
        if: matrix.platform == 'linux'
        run: |
          work=$(mktemp -d)
          dpkg-deb --info dist/desktop/*.deb
          dpkg-deb -x dist/desktop/*.deb "$work/deb"
          node scripts/desktop-smoke.ts "$(dirname "$(find "$work/deb" -name drop.mjs | head -n 1)")"
          cp dist/desktop/*.AppImage "$work/drop.AppImage"
          chmod +x "$work/drop.AppImage"
          (cd "$work" && ./drop.AppImage --appimage-extract > /dev/null)
          node scripts/desktop-smoke.ts "$(dirname "$(find "$work/squashfs-root" -name drop.mjs | head -n 1)")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.label }}
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed updater artifacts
        if: env.UPDATE_SIGNING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updates-${{ matrix.label }}
          path: dist/updates/
          if-no-files-found: error
          retention-days: 14

  # Draft only, in this repository only: write access is granted here and nowhere else.
  release:
    name: draft release
    needs: [meta, build]
    if: >-
      github.repository == 'memolabs-dev/drop' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # Sigstore certificate for the attestations
      attestations: write # store the attestations
    env:
      UPDATE_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Download signed updates
        if: env.UPDATE_SIGNING == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: updates-*
          path: signed-updates
          merge-multiple: true
      - name: Assemble the complete updater feed
        if: env.UPDATE_SIGNING == 'true'
        env:
          DROP_RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          node scripts/merge-desktop-updates.ts release/latest.json signed-updates/*.json
          find signed-updates -maxdepth 1 -type f ! -name '*.json' -exec cp {} release/ \;
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          drop $VERSION for macOS (Apple silicon, Intel), Windows (x64) and Linux (x64, arm64).

          Install and verify: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md
          Checksums: SHA256SUMS.txt. Provenance: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`.
          Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID from $GITHUB_SHA.
          EOF
          flags=(--draft --target "$GITHUB_SHA" --title "drop $VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

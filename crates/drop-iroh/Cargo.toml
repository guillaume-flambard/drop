[package]
name = "drop-iroh"
version = "0.1.0"
description = "drop's Internet path: one iroh endpoint driven by the drop daemon over stdin and stdout"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
iroh = "=1.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"

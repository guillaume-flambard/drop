[package]
name = "drop-desktop"
version = "0.1.0"
description = "drop, dans la barre de menus ou la zone de notification"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
url = "2"
serde_json = "1"
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true

# Request notifications with « Voir » and « Refuser » (T4.30): the UserNotifications framework, through the objc2
# bindings Tauri already locks (objc2 0.6, objc2-foundation and objc2-user-notifications 0.3, block2 0.6). They
# replace mac-notification-sys, built on NSUserNotification, deprecated since macOS 11.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSSet", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# Windows and Linux start a new process for each launch and each drop:// link: the first instance keeps the daemon and
# receives the links of the others (v2.tauri.app/plugin/deep-linking, "single instance").
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

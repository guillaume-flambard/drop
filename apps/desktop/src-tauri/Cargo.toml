[package]
name = "drop-desktop"
version = "0.1.0"
description = "drop, dans la barre de menus ou la zone de notification"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
url = "2"
serde_json = "1"
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"

# Windows and Linux start a new process for each launch and each drop:// link: the first instance keeps the daemon and
# receives the links of the others (v2.tauri.app/plugin/deep-linking, "single instance").
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

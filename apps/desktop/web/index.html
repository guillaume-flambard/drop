<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>drop, démarrage</title>
    <style>
      :root {
        color-scheme: light dark;
        --ground: #fbfaf8;
        --ink: #292732;
        --soft: #5e5965;
        --accent: #5656a9;
        --edge: #e2dce2;
        --warn: #a25259;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #24232a;
          --ink: #f5f0f3;
          --soft: #d7cfd7;
          --accent: #b9b1fa;
          --edge: #4f4751;
          --warn: #efa5a9;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        overflow: hidden;
        border-radius: 12px;
        background: transparent;
      }
      body {
        margin: 0;
        height: 100%;
        overflow-y: auto;
        border-radius: 12px;
        background: color-mix(in srgb, var(--ground) 88%, transparent);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--edge);
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      main {
        padding: 36px 24px;
        max-width: 34rem;
      }
      h1 {
        font-size: 21px;
        line-height: 1.22;
        letter-spacing: -0.025em;
        margin: 0 0 12px;
      }
      p {
        color: var(--soft);
        margin: 0 0 18px;
        max-width: 36ch;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 26px;
      }
      .dot {
        width: 9px;
        height: 9px;
        flex: none;
        border-radius: 50%;
        background: var(--accent);
      }
      .dot.error {
        background: var(--warn);
      }
      button {
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--accent);
        border-radius: 9px;
        color: var(--ground);
        background: var(--accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      small {
        display: block;
        margin-top: 16px;
        color: var(--soft);
      }
      #log-box {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--edge);
      }
      #log-box p {
        margin-bottom: 8px;
      }
      code {
        display: block;
        padding: 8px 10px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
        user-select: all;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      button.secondary {
        color: var(--accent);
        background: transparent;
      }
      ::selection {
        background: var(--accent);
        color: var(--ground);
      }
    </style>
  </head>
  <body>
    <header>drop</header>
    <main>
      <div class="status" role="status" aria-live="polite">
        <span class="dot" id="status-dot" aria-hidden="true"></span><span id="state">Démarrage local…</span>
      </div>
      <h1 id="title">Préparation de ton espace</h1>
      <p id="detail">Le moteur démarre sur ce Mac. Les échanges passent par l’infrastructure que tu as choisie.</p>
      <button id="retry" type="button" hidden>Réessayer</button>
      <small id="hint" hidden
        >Tu peux aussi choisir « Réessayer le démarrage » dans le menu drop de la barre de menus.</small
      >
      <div id="log-box" hidden>
        <p>Le journal du moteur, à joindre si tu demandes de l’aide :</p>
        <code id="log-path"></code>
        <div class="actions">
          <button id="open-logs" type="button" class="secondary">Ouvrir le dossier des journaux</button>
          <button id="copy-log" type="button" class="secondary">Copier le chemin</button>
        </div>
        <small id="log-note" role="status"></small>
      </div>
    </main>
    <script>
      const states = {
        E_INIT: [
          'Identité non initialisée',
          'La création de ton espace local a échoué. Vérifie les droits du dossier drop, puis réessaie.',
        ],
        E_CONFIG: [
          'Configuration illisible',
          'Le port local manque ou la configuration est invalide. Corrige-la, puis réessaie.',
        ],
        E_PORT: [
          'Port local déjà utilisé',
          'Un autre programme utilise le port de drop. Ferme-le ou choisis un autre port dans la configuration, puis réessaie.',
        ],
        E_LOG: [
          'Journal inaccessible',
          'drop ne peut pas écrire son journal local. Vérifie les droits du dossier drop, puis réessaie.',
        ],
        E_SPAWN: [
          'Moteur introuvable',
          'Le moteur embarqué ne démarre pas. Réinstalle un paquet Mac vérifié, puis réessaie.',
        ],
        E_START: [
          'Moteur indisponible',
          'Le moteur local ne répond pas dans le délai prévu. Vérifie la configuration, puis réessaie.',
        ],
        E_TOKEN: ['Panneau inaccessible', 'Le jeton local manque. Vérifie les droits du dossier drop, puis réessaie.'],
        E_PANEL: [
          'Panneau inaccessible',
          'La fenêtre de drop ne s’ouvre pas. Quitte puis rouvre l’app ; si le problème persiste, réinstalle un paquet vérifié.',
        ],
        E_RESTART: ['Moteur arrêté', 'La reprise automatique a échoué. Vérifie le journal local, puis réessaie.'],
        E_STATE: [
          'État interne de l’app bloqué',
          'L’app n’a pas pu enregistrer le moteur qu’elle venait de lancer. Quitte puis rouvre drop.',
        ],
      };
      const params = new URLSearchParams(location.search);
      const code = params.get('state');
      // The shell names the log on every page it opens (T4.37); it is shown, as text, only when the start failed.
      const log = params.get('log');
      if (code && states[code]) {
        document.getElementById('state').textContent = 'Démarrage interrompu';
        document.getElementById('status-dot').classList.add('error');
        document.getElementById('title').textContent = states[code][0];
        document.getElementById('detail').textContent = states[code][1];
        document.getElementById('retry').hidden = false;
        document.getElementById('hint').hidden = false;
        document.getElementById('hint').append(' Code de diagnostic : ' + code + '.');
        if (log) {
          document.getElementById('log-path').textContent = log;
          document.getElementById('log-box').hidden = false;
        }
      }
      const note = (text) => {
        document.getElementById('log-note').textContent = text;
      };
      document.getElementById('open-logs').addEventListener('click', async () => {
        try {
          await window.__TAURI_INTERNALS__.invoke('open_logs');
          note('Dossier des journaux ouvert.');
        } catch {
          note('Ouvre ce dossier à la main : son chemin est ci-dessus.');
        }
      });
      document.getElementById('copy-log').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(log || '');
          note('Chemin copié.');
        } catch {
          getSelection()?.selectAllChildren(document.getElementById('log-path'));
          note('Chemin sélectionné : copie-le avec le raccourci du système.');
        }
      });
      document.getElementById('retry').addEventListener('click', async () => {
        const button = document.getElementById('retry');
        button.disabled = true;
        try {
          await window.__TAURI_INTERNALS__.invoke('retry_daemon');
          document.getElementById('state').textContent = 'Nouvelle tentative…';
        } catch {
          button.disabled = false;
          document.getElementById('state').textContent = 'Utilise « Réessayer le démarrage » dans le menu drop.';
        }
      });
    </script>
  </body>
</html>

<title id="join-two-clicks-dark-title">Join a team in two clicks</title>
<desc id="join-two-clicks-dark-desc">Target flow for task T4.23, not built yet: the inviter creates the team and copies one link, the link page detects the system and offers the download, the installed app opens with the invite and relay filled in, then the new member clicks Join and Connect my agents, which detects, connects and sets up their agents.</desc>
<defs>
      <style>#join-two-clicks-dark-root { --color-paper:   #222127;
      --color-ink:     #f3f0f4;
      --color-muted:   #c1b9c4;
      --color-accent:  #c2b9fc;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #join-two-clicks-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #join-two-clicks-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #join-two-clicks-dark-root .diagram-container { overflow-x: visible; }</style>

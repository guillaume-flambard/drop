<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" font-family="Arial, sans-serif" fill="#15234b" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2548ed" stroke-width="1.5"/></marker></defs><rect width="1120" height="390" rx="24" fill="#f5f8ff"/><title id="title">Le trajet d'une réponse</title><desc id="desc">Demande, accord, exécution, relecture et réponse. Julie conserve la décision et les accès. La relecture est requise pour une capacité sensible.</desc><text x="40" y="49" font-size="23" font-weight="700">Une demande précise. Un contrôle à chaque passage.</text><path d="M131 152H982" stroke="#2548ed" stroke-width="3" marker-end="url(#arrow)"/><g fill="white" stroke="#ccd8fa"><rect x="35" y="100" width="186" height="181" rx="16"/><rect x="251" y="100" width="186" height="181" rx="16"/><rect x="467" y="100" width="186" height="181" rx="16"/><rect x="683" y="100" width="186" height="181" rx="16"/><rect x="899" y="100" width="186" height="181" rx="16"/></g><circle cx="73" cy="140" r="18" fill="#2548ed"/><text x="73" y="147" text-anchor="middle" font-size="20" fill="white" font-weight="700">1</text><text x="55" y="195" font-size="23" font-weight="700">Demander</text><text x="55" y="228" font-size="18" fill="#52617e">Une question</text><text x="55" y="253" font-size="18" fill="#52617e">et sa raison</text><circle cx="289" cy="140" r="18" fill="#2548ed"/><text x="289" y="147" text-anchor="middle" font-size="20" fill="white" font-weight="700">2</text><text x="271" y="195" font-size="23" font-weight="700">Autoriser</text><text x="271" y="228" font-size="18" fill="#52617e">Le propriétaire</text><text x="271" y="253" font-size="18" fill="#52617e">décide une fois</text><circle cx="505" cy="140" r="18" fill="#2548ed"/><text x="505" y="147" text-anchor="middle" font-size="20" fill="white" font-weight="700">3</text><text x="487" y="195" font-size="23" font-weight="700">Exécuter</text><text x="487" y="228" font-size="18" fill="#52617e">Seulement les</text><text x="487" y="253" font-size="18" fill="#52617e">outils autorisés</text><circle cx="721" cy="140" r="18" fill="#2548ed"/><text x="721" y="147" text-anchor="middle" font-size="20" fill="white" font-weight="700">4</text><text x="703" y="195" font-size="23" font-weight="700">Relire</text><text x="703" y="228" font-size="18" fill="#52617e">Pour les réponses</text><text x="703" y="253" font-size="18" fill="#52617e">sensibles</text><circle cx="937" cy="140" r="18" fill="#2548ed"/><text x="937" y="147" text-anchor="middle" font-size="20" fill="white" font-weight="700">5</text><text x="919" y="195" font-size="23" font-weight="700">Recevoir</text><text x="919" y="228" font-size="18" fill="#52617e">Une réponse</text><text x="919" y="253" font-size="18" fill="#52617e">et un reçu signé</text><text x="40" y="334" font-size="20">Un refus ou une expiration arrête la demande avant exécution.</text><text x="40" y="363" font-size="18" fill="#52617e">Le propriétaire peut aussi abandonner l’envoi après relecture.</text></svg>
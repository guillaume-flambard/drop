<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" font-family="Arial, sans-serif" fill="#15234b" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2548ed" stroke-width="1.5"/></marker></defs><rect width="1120" height="390" rx="24" fill="#f5f8ff"/><title id="title">Architecture et frontières de confiance</title><desc id="desc">L'agent passe par requester-mcp et le Node local. Le relais route des enveloppes chiffrées vers le Node propriétaire, qui gère l'accord, le runner et les sources. Si le modèle est distant, il reçoit le contexte nécessaire à son appel.</desc><rect x="30" y="30" width="320" height="308" rx="20" fill="white" stroke="#ccd8fa"/><rect x="670" y="30" width="420" height="308" rx="20" fill="white" stroke="#ccd8fa"/><text x="55" y="65" font-size="23" font-weight="700">Chez le demandeur</text><text x="695" y="65" font-size="23" font-weight="700">Chez le propriétaire</text><rect x="55" y="88" width="270" height="49" rx="9" fill="#e7efff"/><text x="190" y="119" text-anchor="middle" font-size="20">Agent + connecteur MCP</text><path d="M190 140V164" stroke="#2548ed" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="180" width="270" height="60" rx="10" fill="#2548ed"/><text x="190" y="218" text-anchor="middle" fill="white" font-size="23">Node local</text><text x="55" y="282" font-size="18" fill="#52617e">La réponse autorisée revient</text><text x="55" y="308" font-size="18" fill="#52617e">dans le contexte de l'agent.</text><path d="M330 210H435M585 210H687" fill="none" stroke="#2548ed" stroke-width="3" marker-end="url(#arrow)"/><rect x="423" y="168" width="168" height="85" rx="18" fill="#e7efff" stroke="#b8c9f6"/><text x="507" y="204" text-anchor="middle" font-size="23" font-weight="700">Relais</text><text x="507" y="232" text-anchor="middle" font-size="18" fill="#52617e">Contenu chiffré</text><text x="510" y="145" text-anchor="middle" font-size="18" fill="#52617e">Connexions sortantes</text><rect x="695" y="88" width="369" height="49" rx="9" fill="#e7efff"/><text x="880" y="119" text-anchor="middle" font-size="20">Consentement et relecture</text><rect x="695" y="180" width="369" height="60" rx="10" fill="#2548ed"/><text x="880" y="218" text-anchor="middle" fill="white" font-size="23">Node + runner</text><text x="695" y="282" font-size="18" fill="#52617e">Sources et outils choisis à l'avance.</text><text x="695" y="308" font-size="18" fill="#52617e">Le modèle peut être local ou distant.</text><text x="40" y="372" font-size="18" fill="#52617e">Attention : un fournisseur LLM distant reçoit la question et les résultats d'outils utilisés par le modèle.</text></svg>
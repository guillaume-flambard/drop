<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" font-family="Arial, sans-serif" fill="#15234b" role="img" aria-labelledby="title desc">
  <title id="title">Cible : un échange dans votre infrastructure</title>
  <desc id="desc">Dans le périmètre choisi par l'organisation, l'agent demandeur passe par MCP et son Node local. Un relais exploité par l'équipe route les enveloppes chiffrées vers le Node propriétaire. Le consentement, les sources et le modèle restent dans ce périmètre. Le socle privé est vérifié avec des fixtures internes ; les agents et modèles réels restent à qualifier.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2548ed" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="390" rx="24" fill="#f5f8ff"/>
  <rect x="20" y="20" width="1080" height="316" rx="20" fill="none" stroke="#b8c9f6" stroke-dasharray="6 5"/>
  <text x="42" y="53" font-size="22" font-weight="700">Cible : votre infrastructure, vos destinations autorisées</text>
  <rect x="40" y="78" width="306" height="234" rx="16" fill="white" stroke="#ccd8fa"/>
  <text x="60" y="112" font-size="22" font-weight="700">Chez le demandeur</text>
  <rect x="60" y="133" width="266" height="44" rx="9" fill="#e7efff"/>
  <text x="193" y="161" text-anchor="middle" font-size="19">Agent + connecteur MCP</text>
  <path d="M193 180V195" stroke="#2548ed" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="208" width="266" height="46" rx="9" fill="#2548ed"/>
  <text x="193" y="238" text-anchor="middle" fill="white" font-size="21">Node local</text>
  <text x="60" y="288" font-size="17" fill="#52617e">La réponse autorisée revient ici.</text>
  <path d="M330 231H435M605 231H690" fill="none" stroke="#2548ed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="423" y="190" width="182" height="84" rx="16" fill="#e7efff" stroke="#b8c9f6"/>
  <text x="514" y="221" text-anchor="middle" font-size="21" font-weight="700">Votre relais</text>
  <text x="514" y="249" text-anchor="middle" font-size="17" fill="#52617e">Contenu chiffré</text>
  <text x="514" y="156" text-anchor="middle" font-size="17" fill="#52617e">Connexions sortantes</text>
  <rect x="674" y="78" width="406" height="234" rx="16" fill="white" stroke="#ccd8fa"/>
  <text x="695" y="112" font-size="22" font-weight="700">Chez le propriétaire</text>
  <rect x="695" y="133" width="363" height="44" rx="9" fill="#e7efff"/>
  <text x="876" y="161" text-anchor="middle" font-size="19">Consentement et relecture</text>
  <rect x="695" y="208" width="363" height="46" rx="9" fill="#2548ed"/>
  <text x="876" y="238" text-anchor="middle" fill="white" font-size="21">Node + exécution encadrée</text>
  <text x="695" y="288" font-size="17" fill="#52617e">Sources, modèle et agents A2A autorisés.</text>
  <text x="40" y="368" font-size="18" fill="#52617e">Socle vérifié avec fixtures : Internet bloqué, aucun repli cloud, aucun compte externe requis.</text>
</svg>

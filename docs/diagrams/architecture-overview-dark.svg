<title id="architecture-overview-dark-title">drop architecture</title>
<desc id="architecture-overview-dark-desc">Architecture of drop on one computer: the Tauri desktop app shows the React workspace served by the local drop Node, coding agents connect to the Node over MCP, capabilities run only after consent and call the owner's own tools, and Nodes reach a teammate through an end-to-end encrypted relay, iroh or local network link.</desc>

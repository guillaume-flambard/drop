      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-overview-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-overview-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-overview-dark-root .diagram-container { overflow-x: visible; }</style>

<title id="roadmap-phases-dark-title">drop roadmap</title>
<desc id="roadmap-phases-dark-desc">Roadmap of drop in task order: shipped so far are the signed protocol, relay and consent, the private profile with 13 agents connected, local network and iroh links, hand answers and published facts, and the notarized Mac app with the React workspace; next come the need measurement and security reviews, Windows and Linux apps, the one-link join, panel design and home bench, then the trial in pairs of colleagues, then the tasks before a public launch.</desc>

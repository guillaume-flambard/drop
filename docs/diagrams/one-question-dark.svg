<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="one-question-dark-title one-question-dark-desc" id="one-question-dark-root">
<title id="one-question-dark-title">One question, end to end</title>
<desc id="one-question-dark-desc">Sequence of one drop question: the requester's agent asks over MCP, the requester Node signs and encrypts it, the relay forwards what it cannot read, the owner Node shows a consent card, and only if the owner allows once does the capability run with fixed tools and checked output, so only the approved answer returns encrypted with a signed receipt; a refusal, a delay or an expiry returns a status and nothing runs.</desc>

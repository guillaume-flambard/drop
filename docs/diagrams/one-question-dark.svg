      <style>#one-question-dark-root { --color-paper:   #222127;
      --color-ink:     #f3f0f4;
      --color-muted:   #c1b9c4;
      --color-accent:  #c2b9fc;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #one-question-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #one-question-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #one-question-dark-root .diagram-container { overflow-x: visible; }</style>

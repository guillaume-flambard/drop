<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" font-family="Arial, sans-serif" fill="#15234b" role="img" aria-labelledby="title desc">
  <title id="title">Cap privé au 9 octobre 2026 : les preuves à construire</title>
  <desc id="desc">Le socle A2A, MCP et consentement existe. Les chantiers visent un profil privé, une connexion simple sur Mac, une preuve sans Internet puis une ouverture publique contrôlée. L'index du dépôt fixe les dépendances et le pilote reste conditionné à la mesure du besoin.</desc>
  <rect width="1120" height="390" rx="24" fill="#f5f8ff"/>
  <text x="40" y="50" font-size="23" font-weight="700">Du socle existant au parcours privé simple</text>
  <text x="40" y="84" font-size="18" fill="#52617e">A2A, MCP, consentement et shell Mac présents. Les étapes ci-dessous restent à prouver.</text>
  <path d="M60 136H1060" stroke="#c8d4ee" stroke-width="3"/>
  <g fill="#e7efff" stroke="#2548ed" stroke-width="2"><circle cx="60" cy="136" r="21"/><circle cx="333" cy="136" r="21"/><circle cx="607" cy="136" r="21"/><circle cx="880" cy="136" r="21"/></g>
  <g text-anchor="middle" font-size="18" fill="#2548ed" font-weight="700"><text x="60" y="143">1</text><text x="333" y="143">2</text><text x="607" y="143">3</text><text x="880" y="143">4</text></g>
  <g font-size="22" font-weight="700"><text x="40" y="197">Le profil privé</text><text x="313" y="197">La simplicité Mac</text><text x="587" y="197">La preuve réseau</text><text x="860" y="197">L’ouverture</text></g>
  <g font-size="18" fill="#52617e"><text x="40" y="236">Relais choisi par l’équipe.</text><text x="40" y="264">Modèle local ou interne.</text><text x="313" y="236">Deux confirmations.</text><text x="313" y="264">Installation et restauration.</text><text x="587" y="236">Échange sans Internet.</text><text x="587" y="264">Sorties externes refusées.</text><text x="860" y="236">Code et contribution.</text><text x="860" y="264">Distribution contrôlée.</text></g>
  <path d="M40 314H1080" stroke="#ccd8fa"/>
  <text x="40" y="351" font-size="18" fill="#52617e">L’index fixe l’ordre et les dépendances. Le pilote reste conditionné à un besoin mesuré.</text>
</svg>

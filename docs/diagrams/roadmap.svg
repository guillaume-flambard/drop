<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" font-family="Arial, sans-serif" fill="#15234b" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2548ed" stroke-width="1.5"/></marker></defs><rect width="1120" height="390" rx="24" fill="#f5f8ff"/><title id="title">Avancement au 8 octobre 2026</title><desc id="desc">La mesure dispose de son outillage mais n'a pas de verdict démontré. Le prototype a été démontré ; son test humain reste ouvert. L'app Mac et la distribution publique restent à construire. L'annuaire et l'installation locale existent.</desc><text x="40" y="50" font-size="23" font-weight="700">Du prototype à l'usage en équipe</text><path d="M70 103H1030" stroke="#c8d4ee" stroke-width="3"/><path d="M70 103H465" stroke="#2548ed" stroke-width="3"/><circle cx="65" cy="103" r="25" fill="#2548ed"/><text x="65" y="110" text-anchor="middle" font-size="20" fill="white" font-weight="700">0</text><text x="40" y="166" font-size="23" font-weight="700">Mesurer le besoin</text><text x="40" y="207" font-size="20">Collecte et classification</text><text x="40" y="236" font-size="20">implémentées.</text><text x="40" y="281" font-size="18" fill="#52617e">Verdict terrain à établir</text><circle cx="430" cy="103" r="25" fill="#2548ed"/><text x="430" y="110" text-anchor="middle" font-size="20" fill="white" font-weight="700">1</text><text x="405" y="166" font-size="23" font-weight="700">Prouver le circuit</text><text x="405" y="207" font-size="20">Démo réelle avec</text><text x="405" y="236" font-size="20">Claude Code et Codex.</text><text x="405" y="281" font-size="18" fill="#52617e">Test humain encore ouvert</text><circle cx="795" cy="103" r="25" fill="#52617e"/><text x="795" y="110" text-anchor="middle" font-size="20" fill="white" font-weight="700">2</text><text x="770" y="166" font-size="23" font-weight="700">Simplifier l’accès</text><text x="770" y="207" font-size="20">App Mac et distribution</text><text x="770" y="236" font-size="20">publique à construire.</text><text x="770" y="281" font-size="18" fill="#52617e">Annuaire et connecteurs locaux</text><path d="M40 314H1080" stroke="#ccd8fa"/><text x="40" y="354" font-size="18" fill="#52617e">Le pilote dépend d’un seuil de besoin mesuré. Aucune date de lancement n’est engagée.</text></svg>
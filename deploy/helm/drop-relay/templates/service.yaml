apiVersion: v1
kind: Service
metadata:
  name: {{ include "drop-relay.name" . }}
  labels:
    {{- include "drop-relay.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "drop-relay.selector" . | nindent 4 }}
  ports:
    - name: relay
      port: {{ if .Values.tls.enabled }}443{{ else }}80{{ end }}
      targetPort: relay
